<main>
    <div>
        <form id="formCliente" action="">
            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome" class="input01" maxlength="80" placeholder="Informe seu nome">

            <label for="dataNascimento">Data de Nascimento</label>
            <input type="date" name="dataNascimento" id="dataNascimento" class="input01">

            <div class="formRow">
                <label for="cpf">CPF</label>
                <input type="text" name="cpf" id="cpf" maxlength="11" placeholder="Informe seu CPF">

                <label for="telefone">Telefone</label>
                <input type="text" name="telefone" id="telefone" placeholder="Informe seu telefone">

                <label for="email">E-mail</label>
                <input type="text" name="email" id="email" placeholder="Informe seu email">

                <label for="sexo">Sexo</label>
                <select name="sexo" id="sexo">
                    <option value="sexoM">Masculino</option>
                    <option value="sexoF">Feminino</option>
                    <option value="sexoN">Não quero informar</option>
                </select>
            </div>

            <div>
                <label for="cep">cep</label>
                <input type="text" name="cep" id="cep" maxlength="9">

                <label for="rua">Logradouro</label>
                <input type="text" name="logradouro" id="logradouro" maxlength="100">

                <label for="numero">Número</label>
                <input type="text" name="numero" id="numero">

                <label for="bairro">Bairro</label>
                <input type="text" name="bairro" id="bairro" maxlength="20">

                <label for="cidade">Cidade</label>
                <input type="text" name="cidade" id="cidade" maxlength="60"> 

                <label for="rua">Uf</label>
                <input type="text" name="uf" id="uf" maxlength="2">
            </div>

            <div>
                <button type="submit" id="btnAdd">Cadastrar Cliente</button>
                <button type="reset" id="btnLimpar">Limpar dados</button>
            </div>
        </form>
    </div>
</main>

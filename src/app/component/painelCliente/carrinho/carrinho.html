<main class="container">
    <div class="titulo">
        <h1>Meu carrinho</h1>
        <p>Confira seus produtos e serviços antes de confirmar o pedido.</p>
    </div>
    <div class="layout">
        <section class="painel"><div class="lista" id="lista"></div></section>
        <aside class="painelResumo">
            <h2>Resumo do pedido</h2>
            <div class="linha"><span>Itens selecionados</span><strong>0</strong></div>
            <div class="linha"><span>Subtotal</span><strong>R$ 0,00</strong></div>
            <div class="linha"><span>Entrega grátis</span></div>
            <div class="linhaTotal"><span>Total</span><strong>R$ 0,00</strong></div>
            <button class="confirmar" id="confirmar">Confirmar pedido</button>
            <p class="aviso">Confira os itens e as quantidades antes de confirmar.</p>
            <div class="mensagem" id="mensagem" role="status"></div>
        </aside>
    </div>
</main>
